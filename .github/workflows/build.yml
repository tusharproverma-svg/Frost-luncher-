
name: Build FROST Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses
        

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          unzip -o FROST_Launcher_Android12_Source.zip -d frost-project

      - name: Build APK
        run: gradle -p frost-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FROST-Launcher-APK
          path: frost-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
